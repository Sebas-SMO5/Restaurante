spring.application.name=backend-restaurante

spring.application.name=backend-restaurante


spring.datasource.url=jdbc:mysql://localhost:3306/bd_restaurante

spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none

logging.level.org.springframework.http.converter.json=TRACE
# ===== Sesión e inicio de sesión =====
# Tiempo de inactividad antes de cerrar la sesión automáticamente.
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# true: las rutas /api/** exigen sesión iniciada (en Postman, llamar primero a POST /api/auth/login).
# false: las APIs quedan abiertas como antes (útil para pruebas).
app.seguridad.proteger-api=true

# Jackson 3 (Spring Boot 4): permite crear registros sin enviar el ID numérico
# (por ejemplo, tablas AUTO_INCREMENT); el ID ausente queda en 0.
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Roles con acceso completo (separados por coma, sin importar mayúsculas).
# Los demás roles tienen permisos limitados (ver Config/Permisos.java).
app.seguridad.roles-admin=Admin,Administrador

# ===== Estados que usa el flujo de pedidos (códigos de la tabla estado) =====
# Pedido (tipo "Pedido")
app.estados.pedido.creado=4
app.estados.pedido.finalizado=5
app.estados.pedido.cancelado=6
# Cada plato dentro del pedido / comanda de cocina (tipo "Peticion")
app.estados.detalle.preparacion=1
app.estados.detalle.listo=2
app.estados.detalle.cancelado=3
# Estado de plato que permite venderlo (tipo "Plato")
app.estados.plato.disponible=8

# PQRS (tipo de estado "PQRS")
app.estados.pqrs.pendiente=11
app.estados.pqrs.atendida=12
# Máximo de PQRS que se pueden radicar desde la página pública por equipo (IP) en una hora.
app.pqrs.publico.maximo-por-hora=5
